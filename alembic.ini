[alembic]
script_location = src/jarvis/platform/migrations
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = null

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = null

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_null]
class = logging.NullHandler
args = ()
level = NOTSET

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
