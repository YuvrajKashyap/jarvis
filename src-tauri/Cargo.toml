[package]
name = "jarvis-host"
version = "0.1.0"
description = "Thin Windows host and supervisor for JARVIS"
authors = ["Yuvraj Kashyap"]
edition = "2024"
rust-version = "1.88"
license = "Proprietary"

[lib]
name = "jarvis_host"
crate-type = ["lib"]

[[bin]]
name = "jarvis-host"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2.11.1", features = ["tray-icon"] }
tauri-plugin-autostart = "2.5.1"
tauri-plugin-global-shortcut = "2.3.1"
tauri-plugin-notification = "2.3.3"
tauri-plugin-single-instance = "2.3.6"
tracing = "0.1"
uuid = { version = "1.18", features = ["v4"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
pedantic = "deny"
